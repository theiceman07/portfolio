<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="640" height="440" fill="#0b1120"/>
  <rect x="16" y="16" width="608" height="408" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="46" text-anchor="middle" fill="#9ca3af" font-size="13" letter-spacing="2">DHT11 TEMPERATURE &amp; HUMIDITY SENSOR</text>

  <rect x="230" y="100" width="180" height="150" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="250" y="120" width="140" height="80" rx="3" fill="#1e293b" stroke="#334155"/>
  <g stroke="#0f172a" stroke-width="1">
    <line x1="260" y1="130" x2="380" y2="130"/><line x1="260" y1="140" x2="380" y2="140"/>
    <line x1="260" y1="150" x2="380" y2="150"/><line x1="260" y1="160" x2="380" y2="160"/>
    <line x1="260" y1="170" x2="380" y2="170"/><line x1="260" y1="180" x2="380" y2="180"/>
    <line x1="260" y1="190" x2="380" y2="190"/>
  </g>
  <text x="320" y="165" text-anchor="middle" fill="#93c5fd" font-size="9">sensing element</text>
  <text x="320" y="230" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="bold">DHT11</text>

  <!-- 3-pin header -->
  <g>
    <rect x="270" y="250" width="10" height="30" fill="#facc15"/>
    <rect x="315" y="250" width="10" height="30" fill="#facc15"/>
    <rect x="360" y="250" width="10" height="30" fill="#facc15"/>
  </g>
  <text x="275" y="300" text-anchor="middle" fill="#f59e0b" font-size="10">VCC</text>
  <text x="320" y="300" text-anchor="middle" fill="#34d399" font-size="10">DATA</text>
  <text x="365" y="300" text-anchor="middle" fill="#6b7280" font-size="10">GND</text>

  <text x="320" y="410" text-anchor="middle" fill="#4b5563" font-size="10">Aosong DHT11 · 0–50°C ±2°C · 20–90% RH ±5% · single-wire digital</text>
