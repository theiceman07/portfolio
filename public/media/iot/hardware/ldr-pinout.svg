<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="640" height="440" fill="#0b1120"/>
  <rect x="16" y="16" width="608" height="408" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" fill="#9ca3af" font-size="13" letter-spacing="2">LDR RESPONSE CURVE &amp; NOISE FILTERING</text>

  <!-- axes -->
  <line x1="80" y1="260" x2="560" y2="260" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="80" y1="100" x2="80" y2="260" stroke="#4b5563" stroke-width="1.5"/>
  <text x="320" y="285" text-anchor="middle" fill="#9ca3af" font-size="10">ambient brightness →</text>
  <text x="45" y="180" fill="#9ca3af" font-size="10" transform="rotate(-90 45 180)">ADC value</text>

  <!-- raw noisy line -->
  <polyline points="90,180 120,140 150,210 180,150 210,230 240,160 270,200 300,150 330,220 360,170 390,210 420,160 450,190" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <text x="450" y="150" fill="#ef4444" font-size="10">raw (noisy)</text>

  <!-- smoothed line -->
  <polyline points="90,190 150,180 210,185 270,178 330,182 390,180 450,183 510,181" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <text x="510" y="200" fill="#34d399" font-size="10">15-sample avg</text>

  <text x="90" y="270" fill="#4b5563" font-size="9">bright (&lt;1000)</text>
  <text x="500" y="270" fill="#4b5563" font-size="9">dark (&gt;3000)</text>

  <rect x="60" y="320" width="520" height="60" rx="6" fill="#111827" stroke="#374151"/>
  <text x="90" y="345" fill="#9ca3af" font-size="10">ESP32 ADC is 12-bit (0–4095) — NOT 10-bit like classic Arduino</text>
  <text x="90" y="365" fill="#9ca3af" font-size="10">Higher reading = darker room. Threshold tuned per install.</text>
</svg>
