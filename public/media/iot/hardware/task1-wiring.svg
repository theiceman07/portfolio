<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="700" height="360" fill="#0b1120"/>
  <rect x="16" y="16" width="668" height="328" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="350" y="46" text-anchor="middle" fill="#e5e7eb" font-size="14" letter-spacing="2" font-weight="bold">TASK 1 — BUILT-IN LED CIRCUIT</text>

  <rect x="260" y="100" width="180" height="120" rx="8" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <text x="350" y="150" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">ESP32</text>
  <text x="350" y="168" text-anchor="middle" fill="#6b7280" font-size="9">GPIO2 → onboard LED</text>

  <circle cx="500" cy="160" r="18" fill="#1f2937" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="164" text-anchor="middle" fill="#34d399" font-size="9">LED</text>
  <line x1="440" y1="160" x2="482" y2="160" stroke="#34d399" stroke-width="2"/>
  <text x="450" y="150" fill="#34d399" font-size="10">GPIO2</text>

  <rect x="60" y="260" width="580" height="70" rx="6" fill="#111827" stroke="#374151"/>
  <text x="90" y="285" fill="#9ca3af" font-size="11">GPIO2 HIGH (3.3V) → LED ON</text>
  <text x="90" y="305" fill="#9ca3af" font-size="11">GPIO2 LOW  (0V)   → LED OFF</text>
  <text x="380" y="285" fill="#6b7280" font-size="10">No external components —</text>
  <text x="380" y="305" fill="#6b7280" font-size="10">resistor + LED are on-board.</text>
</svg>
