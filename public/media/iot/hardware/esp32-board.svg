<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="640" height="440" fill="#0b1120"/>
  <rect x="16" y="16" width="608" height="408" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="320" y="46" text-anchor="middle" fill="#9ca3af" font-size="13" letter-spacing="2">ESP32 DEVKIT V4 — TOP VIEW</text>

  <!-- Board silhouette -->
  <rect x="180" y="80" width="280" height="280" rx="8" fill="#111827" stroke="#374151" stroke-width="2"/>
  <!-- USB connector -->
  <rect x="290" y="60" width="60" height="26" rx="3" fill="#374151" stroke="#4b5563"/>
  <text x="320" y="78" text-anchor="middle" fill="#d1d5db" font-size="10">USB</text>
  <!-- Antenna -->
  <path d="M 400 90 q 30 -20 55 -5" stroke="#4b5563" stroke-width="2" fill="none"/>
  <text x="470" y="88" fill="#6b7280" font-size="10">ANT</text>
  <!-- ESP32 chip -->
  <rect x="255" y="150" width="130" height="90" rx="4" fill="#1f2937" stroke="#4b5563"/>
  <text x="320" y="200" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="bold">ESP32-WROOM</text>
  <text x="320" y="216" text-anchor="middle" fill="#6b7280" font-size="9">DUAL-CORE 160MHz</text>
  <!-- Boot/EN buttons -->
  <circle cx="200" cy="340" r="8" fill="#374151" stroke="#4b5563"/>
  <text x="200" y="365" text-anchor="middle" fill="#6b7280" font-size="9">EN</text>
  <circle cx="440" cy="340" r="8" fill="#374151" stroke="#4b5563"/>
  <text x="440" y="365" text-anchor="middle" fill="#6b7280" font-size="9">BOOT</text>

  <!-- Left pin header -->
  <g fill="#6ee7b7" font-size="10">
    <rect x="160" y="90" width="18" height="260" fill="#065f46" opacity="0.3"/>
    <text x="150" y="100" text-anchor="end" fill="#9ca3af">3V3</text>
    <text x="150" y="130" text-anchor="end" fill="#9ca3af">GND</text>
    <text x="150" y="160" text-anchor="end" fill="#34d399">GPIO2 (LED)</text>
    <text x="150" y="190" text-anchor="end" fill="#34d399">GPIO4 (DHT11)</text>
    <text x="150" y="220" text-anchor="end" fill="#9ca3af">GPIO16</text>
    <text x="150" y="250" text-anchor="end" fill="#9ca3af">GPIO17</text>
    <text x="150" y="280" text-anchor="end" fill="#9ca3af">GPIO18</text>
    <text x="150" y="310" text-anchor="end" fill="#9ca3af">GPIO19</text>
  </g>

  <!-- Right pin header -->
  <g font-size="10">
    <rect x="462" y="90" width="18" height="260" fill="#065f46" opacity="0.3"/>
    <text x="492" y="100" fill="#9ca3af">5V</text>
    <text x="492" y="130" fill="#9ca3af">GND</text>
    <text x="492" y="160" fill="#34d399">GPIO26 (Relay)</text>
    <text x="492" y="190" fill="#34d399">GPIO34 (LDR)</text>
    <text x="492" y="220" fill="#9ca3af">GPIO25</text>
    <text x="492" y="250" fill="#9ca3af">GPIO33</text>
    <text x="492" y="280" fill="#9ca3af">GPIO32</text>
    <text x="492" y="310" fill="#9ca3af">EN</text>
  </g>

  <text x="320" y="410" text-anchor="middle" fill="#4b5563" font-size="10">49mm × 26mm × 13mm · Xtensa dual-core · 4MB flash</text>
</svg>
