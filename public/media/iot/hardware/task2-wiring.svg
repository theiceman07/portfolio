<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="800" height="420" fill="#0b1120"/>
  <rect x="16" y="16" width="768" height="388" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="400" y="46" text-anchor="middle" fill="#e5e7eb" font-size="14" letter-spacing="2" font-weight="bold">TASK 2 — RELAY + 230V BULB</text>
  <text x="400" y="64" text-anchor="middle" fill="#6b7280" font-size="10">Low-voltage (left) isolated from mains (right)</text>

  <rect x="60" y="160" width="150" height="100" rx="8" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <text x="135" y="205" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">ESP32</text>
  <text x="135" y="223" text-anchor="middle" fill="#6b7280" font-size="9">GPIO26 → relay</text>

  <rect x="320" y="150" width="160" height="120" rx="8" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="195" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">RELAY</text>
  <text x="400" y="213" text-anchor="middle" fill="#c4b5fd" font-size="9">SRD-05VDC-SL-C</text>
  <text x="400" y="230" text-anchor="middle" fill="#6b7280" font-size="8">GPIO26 HIGH = coil ON</text>
  <line x1="210" y1="210" x2="320" y2="210" stroke="#34d399" stroke-width="2"/>
  <text x="235" y="200" fill="#34d399" font-size="10">GPIO26</text>

  <rect x="600" y="150" width="150" height="70" rx="6" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
  <text x="675" y="178" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">230V OUTLET</text>
  <text x="675" y="196" text-anchor="middle" fill="#fca5a5" font-size="9">Live · Neutral · Ground</text>
  <line x1="480" y1="200" x2="600" y2="185" stroke="#f59e0b" stroke-width="2"/>
  <text x="510" y="190" fill="#f59e0b" font-size="9">COM (Live)</text>

  <circle cx="700" cy="290" r="24" fill="#1f2937" stroke="#facc15" stroke-width="2"/>
  <text x="700" y="295" text-anchor="middle" fill="#facc15" font-size="10">60W</text>
  <line x1="480" y1="230" x2="700" y2="266" stroke="#34d399" stroke-width="2"/>
  <text x="560" y="255" fill="#34d399" font-size="9">NO → bulb live</text>
  <line x1="630" y1="185" x2="676" y2="270" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="600" y="230" fill="#38bdf8" font-size="9">Neutral — direct, not switched</text>

  <rect x="60" y="320" width="690" height="70" rx="6" fill="#111827" stroke="#374151"/>
  <text x="90" y="345" fill="#ef4444" font-size="10">⚠ Only Live is routed through the relay. Neutral connects directly.</text>
  <text x="90" y="365" fill="#9ca3af" font-size="10">Verify relay logic with a safe 5V bench signal before ever touching mains.</text>
</svg>
