<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="640" height="440" fill="#0b1120"/>
  <rect x="16" y="16" width="608" height="408" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" fill="#9ca3af" font-size="13" letter-spacing="2">DHT11 PINOUT &amp; PULL-UP WIRING</text>

  <rect x="260" y="90" width="120" height="80" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="135" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="bold">DHT11</text>

  <line x1="290" y1="170" x2="290" y2="230" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="320" y1="170" x2="320" y2="230" stroke="#34d399" stroke-width="1.5"/>
  <line x1="350" y1="170" x2="350" y2="230" stroke="#6b7280" stroke-width="1.5"/>

  <text x="290" y="248" text-anchor="middle" fill="#f59e0b" font-size="10">1: VCC (3.3V)</text>
  <text x="320" y="266" text-anchor="middle" fill="#34d399" font-size="10">2: DATA → GPIO4</text>
  <text x="350" y="248" text-anchor="middle" fill="#6b7280" font-size="10">4: GND</text>
  <text x="320" y="284" text-anchor="middle" fill="#4b5563" font-size="9">(pin 3 = NC, not used)</text>

  <!-- pull-up resistor detail -->
  <rect x="80" y="200" width="60" height="16" fill="#374151" stroke="#4b5563"/>
  <text x="110" y="196" text-anchor="middle" fill="#a78bfa" font-size="10">4.7–10kΩ</text>
  <line x1="110" y1="216" x2="110" y2="170" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="110" y1="170" x2="290" y2="170" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="60" y="230" fill="#a78bfa" font-size="9">pull-up to VCC</text>

  <rect x="60" y="310" width="520" height="70" rx="6" fill="#111827" stroke="#374151"/>
  <text x="90" y="335" fill="#ef4444" font-size="10">⚠ Read interval must be ≥ 2s — faster polling returns stale/garbage data</text>
  <text x="90" y="358" fill="#9ca3af" font-size="10">Timing-sensitive single-wire protocol — not I2C or SPI</text>
</svg>
