<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="640" height="440" fill="#0b1120"/>
  <rect x="16" y="16" width="608" height="408" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" fill="#9ca3af" font-size="13" letter-spacing="2">ESP32 PINOUT — FUNCTIONAL MAP</text>

  <rect x="240" y="170" width="160" height="100" rx="6" fill="#111827" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="320" y="215" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">ESP32</text>
  <text x="320" y="232" text-anchor="middle" fill="#6b7280" font-size="9">12-bit ADC · 34 GPIO</text>

  <!-- power -->
  <line x1="240" y1="190" x2="150" y2="80" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="150" cy="80" r="3" fill="#f59e0b"/>
  <text x="60" y="84" fill="#f59e0b" font-size="11">3V3 / 5V — Power in</text>

  <line x1="240" y1="210" x2="150" y2="360" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="150" cy="360" r="3" fill="#6b7280"/>
  <text x="30" y="364" fill="#9ca3af" font-size="11">GND — Common ground</text>

  <!-- GPIO2 LED -->
  <line x1="400" y1="185" x2="500" y2="120" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="500" cy="120" r="3" fill="#34d399"/>
  <text x="510" y="116" fill="#34d399" font-size="11">GPIO2</text>
  <text x="510" y="130" fill="#6b7280" font-size="9">Onboard LED · active HIGH</text>

  <!-- GPIO4 DHT11 -->
  <line x1="400" y1="205" x2="500" y2="170" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="500" cy="170" r="3" fill="#a78bfa"/>
  <text x="510" y="166" fill="#a78bfa" font-size="11">GPIO4</text>
  <text x="510" y="180" fill="#6b7280" font-size="9">DHT11 data · needs pull-up</text>

  <!-- GPIO26 relay -->
  <line x1="400" y1="235" x2="500" y2="270" stroke="#f472b6" stroke-width="1.5"/>
  <circle cx="500" cy="270" r="3" fill="#f472b6"/>
  <text x="510" y="266" fill="#f472b6" font-size="11">GPIO26</text>
  <text x="510" y="280" fill="#6b7280" font-size="9">Relay control · active-LOW</text>

  <!-- GPIO34 LDR -->
  <line x1="400" y1="255" x2="500" y2="320" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="500" cy="320" r="3" fill="#38bdf8"/>
  <text x="510" y="316" fill="#38bdf8" font-size="11">GPIO34</text>
  <text x="510" y="330" fill="#6b7280" font-size="9">LDR analog in · input-only</text>

  <text x="320" y="410" text-anchor="middle" fill="#4b5563" font-size="10">Only the pins used across Tasks 1–4 are highlighted</text>
</svg>
