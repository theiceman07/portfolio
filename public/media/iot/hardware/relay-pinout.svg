<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="640" height="440" fill="#0b1120"/>
  <rect x="16" y="16" width="608" height="408" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" fill="#9ca3af" font-size="13" letter-spacing="2">RELAY LOGIC — ACTIVE-LOW</text>

  <!-- left: coil side -->
  <rect x="60" y="90" width="200" height="120" rx="6" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="160" y="115" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">COIL SIDE (3.3V logic)</text>
  <text x="90" y="150" fill="#f59e0b" font-size="11">VCC → 5V</text>
  <text x="90" y="172" fill="#9ca3af" font-size="11">GND → GND</text>
  <text x="90" y="194" fill="#34d399" font-size="11">IN → GPIO26 (LOW = ON)</text>

  <!-- right: contact side -->
  <rect x="380" y="90" width="200" height="120" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="115" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">CONTACT SIDE (230V)</text>
  <text x="410" y="150" fill="#f59e0b" font-size="11">COM → Live in</text>
  <text x="410" y="172" fill="#34d399" font-size="11">NO → Bulb (closes when ON)</text>
  <text x="410" y="194" fill="#6b7280" font-size="11">NC → unused</text>

  <path d="M 260 150 L 380 150" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="140" text-anchor="middle" fill="#4b5563" font-size="9">isolation</text>

  <!-- state diagram -->
  <rect x="60" y="250" width="520" height="130" rx="6" fill="#111827" stroke="#374151"/>
  <text x="90" y="278" fill="#e5e7eb" font-size="12" font-weight="bold">State Table</text>
  <text x="90" y="305" fill="#9ca3af" font-size="11">IN = HIGH (3.3V)  →  coil OFF  →  NO contact OPEN   →  bulb OFF</text>
  <text x="90" y="330" fill="#34d399" font-size="11">IN = LOW  (0V)    →  coil ON   →  NO contact CLOSED →  bulb ON</text>
  <text x="90" y="358" fill="#ef4444" font-size="10">⚠ Reversed from intuition — verify at 5V bench signal before mains</text>
</svg>
