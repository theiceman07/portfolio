<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="640" height="440" fill="#0b1120"/>
  <rect x="16" y="16" width="608" height="408" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="46" text-anchor="middle" fill="#9ca3af" font-size="13" letter-spacing="2">SRD-05VDC-SL-C RELAY MODULE</text>

  <rect x="170" y="90" width="300" height="240" rx="8" fill="#111827" stroke="#374151" stroke-width="2"/>

  <!-- relay can -->
  <rect x="330" y="120" width="110" height="90" rx="4" fill="#1f2937" stroke="#4b5563"/>
  <text x="385" y="160" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="bold">RELAY</text>
  <text x="385" y="176" text-anchor="middle" fill="#6b7280" font-size="9">SONGLE SRD-05VDC</text>

  <!-- status LED -->
  <circle cx="200" cy="130" r="6" fill="#ef4444"/>
  <text x="200" y="150" text-anchor="middle" fill="#6b7280" font-size="8">LED</text>

  <!-- screw terminals mains side -->
  <g>
    <rect x="330" y="240" width="30" height="20" fill="#374151" stroke="#4b5563"/>
    <text x="345" y="275" text-anchor="middle" fill="#f59e0b" font-size="10">COM</text>
    <rect x="380" y="240" width="30" height="20" fill="#374151" stroke="#4b5563"/>
    <text x="395" y="275" text-anchor="middle" fill="#f59e0b" font-size="10">NO</text>
    <rect x="430" y="240" width="30" height="20" fill="#374151" stroke="#4b5563"/>
    <text x="445" y="275" text-anchor="middle" fill="#6b7280" font-size="10">NC</text>
  </g>

  <!-- header pins low-voltage side -->
  <g fill="#34d399" font-size="10">
    <rect x="185" y="210" width="16" height="60" fill="#065f46" opacity="0.3"/>
    <text x="193" y="205" text-anchor="middle" fill="#f59e0b">VCC</text>
    <text x="193" y="290" text-anchor="middle" fill="#6b7280">GND</text>
  </g>
  <g>
    <rect x="225" y="210" width="16" height="60" fill="#065f46" opacity="0.3"/>
    <text x="233" y="205" text-anchor="middle" fill="#34d399">IN</text>
  </g>

  <text x="320" y="410" text-anchor="middle" fill="#4b5563" font-size="10">SPDT · 250V AC / 10A contact rating · ~70mA coil current</text>
</svg>
