<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="900" height="620" fill="#0b1120"/>
  <rect x="16" y="16" width="868" height="588" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="450" y="46" text-anchor="middle" fill="#e5e7eb" font-size="15" letter-spacing="2" font-weight="bold">FORGE — FULL SYSTEM WIRING</text>
  <text x="450" y="66" text-anchor="middle" fill="#6b7280" font-size="11">Low-voltage logic (left/center) isolated from 230V mains (right) via relay</text>

  <!-- ESP32 center -->
  <rect x="370" y="240" width="160" height="110" rx="8" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <text x="450" y="285" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="bold">ESP32</text>
  <text x="450" y="303" text-anchor="middle" fill="#6b7280" font-size="9">DevKit V4</text>
  <text x="450" y="325" text-anchor="middle" fill="#6b7280" font-size="9">3.3V logic</text>

  <!-- DHT11 -->
  <rect x="90" y="100" width="150" height="80" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165" y="132" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="bold">DHT11</text>
  <text x="165" y="150" text-anchor="middle" fill="#93c5fd" font-size="9">temp + humidity</text>
  <path d="M 240 150 C 300 150, 320 200, 370 260" stroke="#34d399" stroke-width="2" fill="none"/>
  <circle cx="370" cy="260" r="3" fill="#34d399"/>
  <text x="255" y="200" fill="#34d399" font-size="10">GPIO4</text>

  <!-- LDR -->
  <rect x="90" y="420" width="150" height="80" rx="6" fill="#111827" stroke="#facc15" stroke-width="1.5"/>
  <text x="165" y="452" text-anchor="middle" fill="#facc15" font-size="12" font-weight="bold">LDR MODULE</text>
  <text x="165" y="470" text-anchor="middle" fill="#fde68a" font-size="9">ambient light</text>
  <path d="M 240 460 C 300 460, 320 380, 370 335" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <circle cx="370" cy="335" r="3" fill="#38bdf8"/>
  <text x="255" y="410" fill="#38bdf8" font-size="10">GPIO34 (ADC)</text>

  <!-- Power rail -->
  <rect x="370" y="100" width="160" height="50" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="130" text-anchor="middle" fill="#f59e0b" font-size="11">USB 5V Supply</text>
  <line x1="450" y1="150" x2="450" y2="240" stroke="#f59e0b" stroke-width="2"/>

  <!-- Relay -->
  <rect x="650" y="250" width="150" height="90" rx="6" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="725" y="285" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">RELAY</text>
  <text x="725" y="303" text-anchor="middle" fill="#c4b5fd" font-size="9">SRD-05VDC · active-LOW</text>
  <path d="M 530 290 L 650 290" stroke="#34d399" stroke-width="2"/>
  <circle cx="650" cy="290" r="3" fill="#34d399"/>
  <text x="555" y="280" fill="#34d399" font-size="10">GPIO26</text>

  <!-- Mains -->
  <rect x="650" y="420" width="150" height="60" rx="6" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
  <text x="725" y="446" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">230V WALL OUTLET</text>
  <text x="725" y="464" text-anchor="middle" fill="#fca5a5" font-size="9">Live / Neutral / Ground</text>
  <line x1="725" y1="340" x2="725" y2="420" stroke="#f59e0b" stroke-width="2"/>
  <text x="735" y="385" fill="#f59e0b" font-size="9">COM</text>

  <!-- Bulb -->
  <circle cx="820" cy="290" r="26" fill="#1f2937" stroke="#facc15" stroke-width="2"/>
  <text x="820" y="295" text-anchor="middle" fill="#facc15" font-size="10">60W</text>
  <path d="M 800 290 L 780 290" stroke="#facc15" stroke-width="2"/>
  <text x="850" y="270" fill="#fde68a" font-size="9" text-anchor="middle">Bulb</text>
  <text x="850" y="284" fill="#6b7280" font-size="8" text-anchor="middle">NO contact</text>

  <!-- Firebase cloud -->
  <rect x="370" y="510" width="160" height="70" rx="8" fill="#111827" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="450" y="542" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">Firebase RTDB</text>
  <text x="450" y="560" text-anchor="middle" fill="#6b7280" font-size="9">every 2s · bidirectional</text>
  <line x1="450" y1="350" x2="450" y2="510" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Logic note -->
  <rect x="620" y="500" width="240" height="80" rx="6" fill="#111827" stroke="#374151"/>
  <text x="640" y="524" fill="#9ca3af" font-size="10">GPIO26 LOW  → relay ON  → bulb ON</text>
  <text x="640" y="544" fill="#9ca3af" font-size="10">GPIO26 HIGH → relay OFF → bulb OFF</text>
  <text x="640" y="566" fill="#ef4444" font-size="9">Defaults OFF if connection drops</text>
</svg>
